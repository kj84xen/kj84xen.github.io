<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBT 문제 풀기 | IT 토픽 노트</title>
<meta name="description" content="IT 토픽 노트에 공개한 토픽으로 직접 만든 문제를 풉니다.">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=202610100042">
</head>
<body class="exam-page">
<div class="wrap">
  <header class="top">
    <a class="brand" href="./"><img src="img/logo.png" alt="">IT 토픽 노트</a>
    <nav aria-label="메뉴" data-links>
      <a class="text" href="practice.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg><span>답안 연습</span></a>
    </nav>
  </header>

  <main class="exam">
    <h1 class="sr">CBT 문제 풀기</h1>
    <form class="tools" id="tools" role="search" onsubmit="return false">
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="search" id="kw" placeholder="문제 검색" aria-label="문제 검색" autocomplete="off"></label>
      <select id="scope" aria-label="토픽 선택"></select>
      <label class="chk"><input type="checkbox" id="only-wrong"><span>틀린 문제만</span></label>
      <label class="chk"><input type="checkbox" id="instant"><span>바로 채점</span></label>
      <div class="zoom" role="group" aria-label="글자 크기">
        <button type="button" data-z="0" aria-label="글자 크기 보통">가</button><button type="button" data-z="1" aria-label="글자 크기 크게">가</button><button type="button" data-z="2" aria-label="글자 크기 아주 크게">가</button>
      </div>
    </form>

    <div class="board">
      <section class="paper" id="paper" aria-live="polite"></section>
      <aside class="sheet" id="sheet" aria-label="답안 표기란">
        <div class="sheet-head"><b>답안 표기란</b><span id="left"></span>
          <button type="button" class="sheet-close" id="sheet-close" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
        <ol class="omr" id="omr"></ol>
        <div class="sheet-foot" id="sheet-foot"></div>
      </aside>
    </div>
  </main>
</div>
<div class="dock" id="dock">
  <button type="button" class="btn ghost" id="d-prev" aria-label="이전 문제"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button type="button" class="btn ghost grow" id="d-sheet">답안 표기란 <span id="d-count"></span></button>
  <button type="button" class="btn ghost" id="d-next" aria-label="다음 문제"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<script src="icons.js?v=202610100042"></script>
<script src="topics.js?v=202610100042"></script>
<script src="questions.js?v=202610100042"></script>
<script src="cbt.js?v=202610100042"></script>
<script src="exam.js?v=202610100042"></script>
</body>
</html>
