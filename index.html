<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./"><img src="img/logo.png" alt="">IT 토픽 노트</a>
    <nav aria-label="메뉴" data-links>
      <a class="text" href="cbt.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 11l2 2 4-4M5 4h14v16H5z"/></svg><span>CBT</span></a>

  <section class="hero">

    <h1>하루 한 토픽,<br>답안 한 장</h1>

        <div class="head"><h2>CBT 문제 풀기</h2></div>

      </div>
      <div class="q" id="preview"></div>
    </div>
  </section>
